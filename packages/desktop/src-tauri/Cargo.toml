[package]
name = "whispermesh-core"
version = "0.1.0"
description = "WhisperMesh Rust Core - Cryptography, Secure Storage & Native Engine"
edition = "2021"

[lib]
name = "whispermesh_core"
path = "src/lib.rs"

[[bin]]
name = "whispermesh"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
rmp-serde = "1.3"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
