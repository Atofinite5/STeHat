# WhisperMesh coturn STUN/TURN Server Configuration
listening-port=3478
tls-listening-port=5349

# Realm for authentication
realm=whispermesh.net

# Long-term credential mechanism (RFC 5766)
lt-cred-mech

# Fingerprint in TURN messages
fingerprint

# Bandwidth and rate limiting
max-bps=3000000
bps-capacity=0

# Security: prevent loopback relays
no-loopback-peers
no-multicast-peers

# Logging
verbose
